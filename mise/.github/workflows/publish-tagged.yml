#  THIS TASK IS OWNED BY THE BUILD SYSTEM DO NOT EDIT!
name: Publish Tagged Release
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Final Build, Test and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          experimental: true

      - uses: docker/login-action@v3
        with:
          username: robot$dsh-github-actions
          password: ${{ secrets.DSH_REGISTRY_PASSWORD }}
          registry: registry.cp.kpn-dsh.com

      - run: |
          echo "$GITHUB_REF_NAME"
          VERSION="$(echo "$GITHUB_REF_NAME" | tr -d 'v')"
          export VERSION
          mise run publish

      - uses: klarrio-kpn-dsh/dsh-github-actions/notification/failure@v3
        if: ${{ failure() }}
        with:
          message: "[ERROR] Publish release ${{ github.server_url }}/${{ github.repository }}/releases/${{ github.ref_name }}\n\t\tJob: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          slack_token: ${{ secrets.SLACK_GITHUBACTIONSCI_TOKEN }}